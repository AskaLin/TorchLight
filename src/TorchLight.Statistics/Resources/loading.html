<html>
<head>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #ffd700;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .loading {
      text-align: center;
    }

    .spinner {
      margin: 0 auto 12px;
      width: 32px;
      height: 32px;
      border: 4px solid #ffd700;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <div class='loading'>
    <div class='spinner'></div>
    <div>載入中，請稍候…</div>
  </div>
</body>
</html>
